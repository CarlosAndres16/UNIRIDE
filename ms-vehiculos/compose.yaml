services:
  vehiculos-db:
    image: postgres:16
    container_name: uniride-vehiculos-db
    environment:
      POSTGRES_DB: ${DB_NAME:-unirride_vehiculos}
      POSTGRES_USER: ${DB_USER:-uniride}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - vehiculos_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  vehiculos-api:
    build: .
    container_name: uniride-vehiculos-api
    env_file:
      - .env.practica
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      SERVER_HOST: 0.0.0.0
      DB_HOST: vehiculos-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unirride_vehiculos}
      DB_USER: ${DB_USER:-uniride}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "${SERVER_PORT:-8082}:${SERVER_PORT:-8082}"
    depends_on:
      vehiculos-db:
        condition: service_healthy

volumes:
  vehiculos_data:
