services:
  vehiculos-db:
    image: postgres:16
    container_name: uniride-vehiculos-db
    environment:
      POSTGRES_DB: unirride_vehiculos
      POSTGRES_USER: uniride
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
    ports:
      - "5434:5432"
    volumes:
      - vehiculos_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniride -d unirride_vehiculos"]
      interval: 5s
      timeout: 5s
      retries: 10

  vehiculos-api:
    build: .
    container_name: uniride-vehiculos-api
    environment:
      SERVER_PORT: 8082
      DB_HOST: vehiculos-db
      DB_PORT: 5432
      DB_NAME: unirride_vehiculos
      DB_USER: uniride
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
    ports:
      - "8082:8082"
    depends_on:
      vehiculos-db:
        condition: service_healthy

volumes:
  vehiculos_data:
