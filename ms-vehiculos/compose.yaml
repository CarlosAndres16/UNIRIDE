
services:
  vehiculos-db:
    image: postgres:16
    container_name: uniride-vehiculos-db
    environment:
      POSTGRES_DB: uniride_vehiculos
      POSTGRES_USER: uniride
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uniride_local_dev}
    ports:
      - "5434:5432"
    volumes:
      - vehiculos_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniride -d uniride_vehiculos"]
      interval: 5s
      timeout: 5s
      retries: 10

  vehiculos-api:
    build: .
    container_name: uniride-vehiculos-api
    environment:
      DB_HOST: vehiculos-db
      DB_PORT: 5432
      DB_NAME: uniride_vehiculos
      DB_USER: uniride
      DB_PASSWORD: ${DB_PASSWORD:-uniride_local_dev}
    ports:
      - "8000:8000"
    depends_on:
      vehiculos-db:
        condition: service_healthy

volumes:
  vehiculos_data:
